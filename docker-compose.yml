services:
  postgres:
    image: postgres:17
    container_name: lostandfound-postgres
    environment: 
      POSTGRES_DB: lostandfound
      POSTGRES_USER: lostandfound
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: